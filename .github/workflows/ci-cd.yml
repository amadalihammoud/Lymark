name: Lymark CI/CD

on:
  push:
    branches: [main, claude/harness-fix, mistral/desktop-web]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run web:build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lymark-web-build
          path: dist/
          retention-days: 7

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O `desktop/` tem package.json próprio: é dele que vêm o electron e o
      # electron-builder. Sem esta instalação o passo de build não encontra o
      # comando.
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build desktop web app
        run: npm run web:build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build Electron app for Linux
        run: npm run build:linux
        working-directory: desktop
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      # Uma fonte ausente não gera erro: o app abre e não carimba. Só uma
      # verificação explícita pega isso.
      - name: Verify package contents
        run: node scripts/verify-package.js dist-electron/linux-unpacked ../dist
        working-directory: desktop

      # `dist/` é a saída do tsc; os instaladores vão para `dist-electron/`.
      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lymark-desktop-linux
          path: |
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.deb
          retention-days: 7

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build desktop web app
        run: npm run web:build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build Electron app for Windows
        run: npm run build:windows
        working-directory: desktop
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Verify package contents
        run: node scripts/verify-package.js dist-electron/win-unpacked ../dist
        working-directory: desktop

      # O executável não é assinado: o Windows mostrará aviso do SmartScreen ao
      # instalar. Distribuir sem aviso exige certificado de assinatura de código.
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lymark-desktop-windows
          path: |
            desktop/dist-electron/*.exe
          retention-days: 7
