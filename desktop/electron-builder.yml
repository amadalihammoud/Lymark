# Empacotamento do Lymark Desktop.
# https://www.electron.build/configuration/configuration

appId: app.lymark.desktop
productName: Lymark

# O esquema do deep link de login (`lymark://login#token=…`). O registro em
# tempo de execução (`setAsDefaultProtocolClient`) cobre Windows e Linux; esta
# declaração é o que grava o esquema no Info.plist do macOS, onde o registro
# acontece na instalação e não na primeira execução.
protocols:
  - name: Lymark
    schemes:
      - lymark

directories:
  output: dist-electron

# ATENÇÃO ao editar esta seção.
#
# 1. Os padrões PRECISAM de aspas. Em YAML, um escalar iniciado por `*` é
#    indicador de alias — `- **/*` sem aspas torna o arquivo inválido e o
#    build aborta antes de começar, com "unidentified alias".
#
# 2. Ao declarar `files`, o padrão `**/*` deixa de ser aplicado sozinho. Tudo
#    o que precisa entrar tem de estar listado — inclusive o processo
#    principal. Sem a primeira entrada abaixo, o pacote sai sem `main.js` e o
#    Electron falha com "Unable to find application entry file".
#
# 3. Só o código do desktop entra no asar. O build web vai por
#    `extraResources`, mais abaixo, e o motivo está explicado lá.
files:
  # O `package.json` precisa ficar na RAIZ do asar: é dele que o Electron lê
  # o campo `main`. Com todas as entradas usando `from`/`to`, nada cobria a
  # raiz, e o empacotamento falhava na verificação final com
  # "Application package.json does not exist".
  - "package.json"
  - from: dist
    to: desktop
    filter:
      - "**/*"
  - from: ../assets/images
    to: assets
    filter:
      - "**/*"

win:
  target:
    - nsis
    - portable
  icon: ../assets/images/icon.png
  requestedExecutionLevel: asInvoker

linux:
  target:
    - AppImage
    - deb
  icon: ../assets/images/icon.png
  category: Graphics
  maintainer: Lymark

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  shortcutName: Lymark

appImage:
  artifactName: Lymark-${version}-linux-x64.${ext}

deb:
  packageCategory: graphics

compression: maximum

# Recompilação de dependências nativas contra o ABI do Electron. Desligada
# porque não há nenhuma: `image-size` é JavaScript puro.
npmRebuild: false

# O build web inteiro — incluindo o `canvaskit.wasm`, que `scripts/copy-wasm.js`
# copia para a raiz do `dist/` — vai para `resources/dist`, e não para o asar.
#
# O Expo nomeia a saída dos assets espelhando a origem do módulo, gerando
# `dist/assets/node_modules/@expo-google-fonts/…`. O electron-builder trata
# toda pasta chamada `node_modules` de forma especial e a remove dos filesets
# de `files` — inclusive com uma entrada explícita apontando só para ela.
# O pacote saía sem os 22 arquivos de asset, entre eles as três fontes do
# carimbo; o app abria e não carimbava. `extraResources` usa outro copiador,
# sem esse tratamento, e `main.ts` aponta o `DIST_DIR` para cá quando
# empacotado.
extraResources:
  - from: ../dist
    to: dist
    filter:
      - "**/*"

  # O ffmpeg do vídeo carimbado. Binário nativo não pode viver dentro do
  # asar (não é executável de lá); vai como recurso, e `ffmpegPath()` no
  # main.ts o encontra em `resources/ffmpeg`. O `ffmpeg-static` baixa o
  # binário da plataforma no `npm ci` — e o CI compila cada sistema no
  # runner do próprio sistema, então o binário empacotado é sempre o certo.
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - "ffmpeg*"
      - "LICENSE"

  # O catálogo de traduções, lido em tempo de execução pelo processo principal
  # para montar o menu do sistema e os diálogos de arquivo. Vem por
  # `extraResources`, e não pelo asar, porque `desktop/i18n.ts` o lê do disco
  # com `fs` — importar de fora da pasta mudaria a saída do `tsc` que o
  # mapeamento de `files` acima depende.
  - from: ../i18n/messages
    to: i18n/messages
    filter:
      - "*.json"
