<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@500&family=Pathway+Gothic+One&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #15243C; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F3C218; } a:hover { color: #D9A700; }
    .field-label { font-weight: 500; font-size: 13px; letter-spacing: 0.2px; color: #93A9C0; }
    .input { min-height: 48px; background: #233B63; border-radius: 5px; padding: 10px 12px; display: flex; align-items: center; font-weight: 500; font-size: 15px; color: #FFFFFF; font-variant-numeric: tabular-nums; box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #15243C; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1; display: flex; flex-direction: column; padding: 0 16px; min-height: 0;">

    <!-- Cabeçalho compacto + seletor de MODO: Vídeo deixa de ser um botão enterrado -->
    <div style="padding-top: 14px; padding-bottom: 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #294675; margin-bottom: 12px;">
      <svg width="30" height="30" viewBox="0 0 38 38" aria-label="Lymark">
        <circle cx="19" cy="19" r="19" fill="#294675"></circle>
        <rect x="12" y="10.2" width="4.2" height="17.5" fill="#FFFFFF"></rect>
        <rect x="12" y="23.5" width="10.8" height="4.2" fill="#FFFFFF"></rect>
        <rect x="26.2" y="10.2" width="3" height="17.5" fill="#F3C218"></rect>
      </svg>
      <div style="font-weight: 700; font-size: 19px; letter-spacing: 0.5px;">Ly<span style="color: #F3C218;">mark</span></div>

      <div style="margin-left: auto; display: flex; background: #0F192A; border: 1px solid #294675; border-radius: 999px; padding: 3px;">
        <span style="padding: 7px 18px; border-radius: 999px; background: #F3C218; color: #0F192A; font-weight: 700; font-size: 13px;">Foto</span>
        <span style="padding: 7px 18px; border-radius: 999px; color: #93A9C0; font-weight: 500; font-size: 13px;">Vídeo</span>
      </div>
    </div>

    <!-- Palco VAZIO que é o próprio botão: a origem da foto mora aqui -->
    <div style="position: relative; width: 358px; height: 268px; border-radius: 8px; overflow: hidden; border: 1px dashed #4A76A1; background: #182A45; flex: none; display: flex; align-items: center; justify-content: center; gap: 16px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 140px; padding: 18px 0; border-radius: 8px; background: #233B63; border: 1px solid #4A76A1;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M9 3l-1.5 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9zm3 5.5A4.5 4.5 0 1 1 7.5 13 4.5 4.5 0 0 1 12 8.5z"></path></svg>
        <span style="font-weight: 700; font-size: 15px;">Tirar foto</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 140px; padding: 18px 0; border-radius: 8px; background: #233B63; border: 1px solid #4A76A1;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M20 4H8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-9.5 3.5A1.5 1.5 0 1 1 9 9a1.5 1.5 0 0 1 1.5-1.5zM8 16l3.2-4 2.3 2.6L16.5 11l3.5 5H8zM4 8H3a1 1 0 0 0-1 1v10a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-1H4V8z"></path></svg>
        <span style="font-weight: 700; font-size: 15px;">Da galeria</span>
      </div>
    </div>

    <!-- Os dados continuam logo abaixo — nada muda no fluxo de preencher -->
    <div style="display: flex; gap: 8px; margin-top: 16px;">
      <div style="flex: 0.8; display: flex; flex-direction: column; gap: 8px;"><div class="field-label">Hora</div><div class="input">07:42</div></div>
      <div style="flex: 1.5; display: flex; flex-direction: column; gap: 8px;"><div class="field-label">Data</div><div class="input" style="white-space: nowrap;">12 ago. 2026</div></div>
      <div style="flex: 0.9; display: flex; flex-direction: column; gap: 8px;"><div class="field-label">Dia da semana</div><div class="input">Qua</div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
      <div class="field-label">Endereço / Local</div>
      <div style="display: flex; gap: 8px; align-items: flex-start;">
        <div class="input" style="flex: 1; position: relative; white-space: nowrap; overflow: hidden; padding-right: 34px; min-width: 0;">Av. Puglisi, 490 - Centro, Guarujá - SP, 11410-002<span style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; background: linear-gradient(90deg, rgba(35,59,99,0), #233B63 55%);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#93A9C0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span></div>
        <div style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid #4A76A1;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#C7D6E4"><path d="M21 3L3 10.5l7 2.5 2.5 7L21 3z"></path></svg>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
      <div class="field-label">Código de foto</div>
      <div style="display: flex; gap: 8px; align-items: flex-start;">
        <div class="input" style="flex: 1; letter-spacing: 0.5px;">98926A73655DC1</div>
        <div style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid #4A76A1;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C7D6E4" stroke-width="2" stroke-linecap="round"><path d="M20 8a8.1 8.1 0 0 0-15.5 2M4 16a8.1 8.1 0 0 0 15.5-2"></path><path d="M20 3v5h-5M4 21v-5h5"></path></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- A cota informada no momento do gasto, não só na tela de conta -->
  <div style="flex: none; display: flex; justify-content: center; margin-bottom: -6px; position: relative; z-index: 2;">
    <div style="display: flex; align-items: center; gap: 8px; background: #182A45; border: 1px solid #294675; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4FB477" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="color: #C7D6E4;">Salva</span>
      <span style="color: #93A9C0;">·</span>
      <span style="color: #93A9C0;">9 de 12 grátis restantes</span>
    </div>
  </div>

  <!-- Barra de exportação FIXA: a ação âmbar nunca sai da tela -->
  <div style="flex: none; padding: 10px 16px 12px; background: #0F192A; border-top: 1px solid #1C3151; display: flex; gap: 12px;">
    <div style="flex: 1.2; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 5px; background: #F3C218;">
      <span style="font-weight: 700; font-size: 16px; color: #0F192A;">Salvar</span>
    </div>
    <div style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 5px; background: #294675; border: 1px solid #4A76A1;">
      <span style="font-weight: 700; font-size: 16px;">Compartilhar</span>
    </div>
  </div>

  <!-- Barra de abas (inalterada) -->
  <div style="flex: none; background: #0F192A; border-top: 1px solid #1C3151; display: flex; padding: 8px 0 22px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#F3C218"><path d="M9 3l-1.5 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9zm3 5.5A4.5 4.5 0 1 1 7.5 13 4.5 4.5 0 0 1 12 8.5z"></path></svg>
      <span style="font-weight: 500; font-size: 11px; color: #F3C218;">Capturar</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#7C90A6"><path d="M20 4H8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-9.5 3.5A1.5 1.5 0 1 1 9 9a1.5 1.5 0 0 1 1.5-1.5zM8 16l3.2-4 2.3 2.6L16.5 11l3.5 5H8zM4 8H3a1 1 0 0 0-1 1v10a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-1H4V8z"></path></svg>
      <span style="font-weight: 500; font-size: 11px; color: #7C90A6;">Galeria</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#7C90A6"><path d="M12 8.5A3.5 3.5 0 1 0 15.5 12 3.5 3.5 0 0 0 12 8.5zm9.4 4.9l-1.9-.5a7.6 7.6 0 0 0 0-1.8l1.9-.5a1 1 0 0 0 .7-1.2l-.7-2a1 1 0 0 0-1.2-.6l-1.9.6a7.7 7.7 0 0 0-1.3-1.3l.6-1.9a1 1 0 0 0-.6-1.2l-2-.7a1 1 0 0 0-1.2.7l-.5 1.9a7.6 7.6 0 0 0-1.8 0l-.5-1.9a1 1 0 0 0-1.2-.7l-2 .7a1 1 0 0 0-.6 1.2l.6 1.9A7.7 7.7 0 0 0 6 7.4l-1.9-.6a1 1 0 0 0-1.2.6l-.7 2a1 1 0 0 0 .7 1.2l1.9.5a7.6 7.6 0 0 0 0 1.8l-1.9.5a1 1 0 0 0-.7 1.2l.7 2a1 1 0 0 0 1.2.6l1.9-.6a7.7 7.7 0 0 0 1.3 1.3l-.6 1.9a1 1 0 0 0 .6 1.2l2 .7a1 1 0 0 0 1.2-.7l.5-1.9a7.6 7.6 0 0 0 1.8 0l.5 1.9a1 1 0 0 0 1.2.7l2-.7a1 1 0 0 0 .6-1.2l-.6-1.9a7.7 7.7 0 0 0 1.3-1.3l1.9.6a1 1 0 0 0 1.2-.6l.7-2a1 1 0 0 0-.7-1.2z"></path></svg>
      <span style="font-weight: 500; font-size: 11px; color: #7C90A6;">Configurações</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
